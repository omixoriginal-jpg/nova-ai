<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        h1 {
            margin: 0;
            font-size: 20px;
        }
        .content {
            flex: 1;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpg" alt="NOVA Logo" class="logo">
        <h1>NOVA</h1>
    </header>

    <div class="content">
        <h2>Hoş Geldiniz!</h2>
        <p>NOVA yapay zeka web uygulaması yayında.</p>
    </div>

</body>
</html>
