<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA Pro — Profesyonel Yapay Zeka Asistanı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Markdown için Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050508',
                        sidebarBg: '#0b0c10',
                        pillBg: '#12131c',
                        accent: '#00f2fe',
                        accentHover: '#4facfe'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.2); border-radius: 10px; }

        .markdown-body pre { background: #1a1b26; padding: 2.5rem 1rem 1rem 1rem; border-radius: 0.75rem; margin: 0.5rem 0; overflow-x: auto; border: 1px solid #2d3748; position: relative; }
        .markdown-body code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 0.3rem; font-size: 0.8rem; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body p { margin-bottom: 0.5rem; word-break: break-word; }
        .markdown-body strong { color: #00f2fe; font-weight: 600; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.2rem; margin-bottom: 0.5rem; }
        
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 0.8rem 0; display: block; overflow-x: auto; }
        .markdown-body th, .markdown-body td { border: 1px solid #2d3748; padding: 0.5rem; text-align: left; font-size: 0.85rem; }
        .markdown-body th { background: rgba(0, 242, 254, 0.15); color: #00f2fe; }

        .copy-btn { position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.1); color: #ccc; border: none; padding: 3px 8px; font-size: 10px; border-radius: 4px; cursor: pointer; z-index: 10; transition: background 0.2s; }
        .copy-btn:hover { background: rgba(0, 242, 254, 0.3); color: #fff; }

        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            #sidebar { width: 80% !important; max-width: 300px; }
            #sidebar.sidebar-kapali { transform: translateX(-100%); }
            #sidebar:not(.sidebar-kapali) { transform: translateX(0); }
        }

        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }
        .typing-dot span { animation: blink 1.4s infinite both; height: 6px; width: 6px; background-color: #00f2fe; border-radius: 50%; display: inline-block; margin: 0 1px; }
        .typing-dot span:nth-child(2) { animation-delay: .2s; }
        .typing-dot span:nth-child(3) { animation-delay: .4s; }

        html:not(.dark) { background-color: #f3f4f6 !important; color: #1f2937 !important; }
        html:not(.dark) body { background-color: #f3f4f6; color: #1f2937; }
        html:not(.dark) aside { background-color: #e5e7eb !important; border-color: #d1d5db !important; }
        html:not(.dark) header { background-color: rgba(243, 244, 246, 0.9) !important; border-color: #d1d5db !important; }
        html:not(.dark) .bg-pillBg { background-color: #ffffff !important; border-color: #d1d5db !important; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans h-[100dvh] flex overflow-hidden relative">

    <div id="mobilPerde" class="fixed inset-0 bg-black/70 z-30 hidden md:hidden transition-opacity"></div>

    <!-- SOL MENÜ -->
    <aside id="sidebar" class="w-72 bg-sidebarBg flex flex-col border-r border-gray-800 z-40 fixed md:relative h-full shadow-2xl md:shadow-none justify-between sidebar-kapali md:translate-x-0 inset-y-0 left-0">
        <div>
            <div class="p-4 flex items-center justify-between border-b border-gray-800/50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#12233f] flex items-center justify-center shadow-lg border border-cyan-500/30 overflow-hidden shrink-0">
                        <img src="logo.jpg" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <h1 class="text-base font-bold tracking-wider text-cyan-400">NOVA PRO</h1>
                </div>
                <button id="mobilMenuKapat" class="md:hidden text-gray-400 hover:text-white p-1 text-lg cursor-pointer">✕</button>
            </div>

            <div class="p-3">
                <button id="yeniSohbetBtn" class="w-full bg-[#6c5ce7] hover:bg-[#827ffe] text-white font-semibold py-2 px-4 rounded-xl transition shadow-md flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <span>+ Yeni Sohbet</span>
                </button>
            </div>

            <div class="px-3 py-1 text-[11px] font-bold text-gray-500 uppercase tracking-wider flex justify-between items-center">
                <span>Geçmiş</span>
                <div class="flex gap-2">
                    <button id="sohbetIndirBtn" title="Aktif Sohbeti İndir" class="hover:text-cyan-400 cursor-pointer">📥</button>
                    <button id="disaAktarBtn" title="Tümünü Yedekle" class="hover:text-cyan-400 cursor-pointer">📤</button>
                    <label title="Yedek Yükle" class="hover:text-cyan-400 cursor-pointer">
                        📂
                        <input type="file" id="jsonYukle" class="hidden" accept=".json">
                    </label>
                </div>
            </div>

            <div class="px-3 py-1.5">
                <input type="text" id="sohbetArama" placeholder="Tüm mesajlarda ara..."
                    class="w-full bg-darkBg border border-gray-800 rounded-xl px-3 py-1.5 text-xs text-gray-200 placeholder-gray-500 outline-none focus:border-cyan-500 transition">
            </div>

            <div id="gecmisListesi" class="flex-1 overflow-y-auto px-2 space-y-1 pb-4 max-h-[calc(100dvh-280px)]"></div>
        </div>

        <!-- SOL ALT KÖŞE: ATMOSFER VE SES KONTROLLERİ -->
        <div class="p-3 border-t border-gray-800/50 flex gap-2 bg-sidebarBg">
            <div class="relative flex-1">
                <div id="atmosferMenu" class="hidden absolute bottom-12 left-0 w-48 bg-sidebarBg border border-gray-700 rounded-2xl shadow-2xl p-2 z-50 flex flex-col gap-1 max-h-60 overflow-y-auto">
                    <div class="text-[11px] font-bold text-cyan-400 px-2 py-1 uppercase tracking-wider border-b border-gray-800 mb-1">Temalar</div>
                    <button class="atmosfer-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-mod="derinUzay">🌌 Derin Uzay</button>
                    <button class="atmosfer-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-mod="siberpunk">⚡ Siberpunk</button>
                    <button class="atmosfer-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-mod="matris">💻 Matris</button>
                    <button class="atmosfer-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-mod="sakinOrman">🌲 Orman</button>
                    <button class="atmosfer-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-mod="buzul">❄ Buzul</button>
                </div>
                <button id="atmosferMenuToggleBtn" class="w-full bg-gray-800 hover:bg-gray-700 text-cyan-400 font-semibold py-2 px-1 rounded-xl transition flex items-center justify-center gap-1 text-xs border border-gray-700/50 cursor-pointer">
                    <span>✨ Tema</span>
                </button>
            </div>

            <div class="relative flex-1">
                <div id="muzikMenu" class="hidden absolute bottom-12 right-0 w-48 bg-sidebarBg border border-gray-700 rounded-2xl shadow-2xl p-2 z-50 flex flex-col gap-1 max-h-60 overflow-y-auto">
                    <div class="text-[11px] font-bold text-cyan-400 px-2 py-1 uppercase tracking-wider border-b border-gray-800 mb-1">Sesler</div>
                    <button class="muzik-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-muzik="lofi">🎧 Lofi Radyo</button>
                    <button class="muzik-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-muzik="yagmur">🌧️ Yağmur</button>
                    <button class="muzik-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-muzik="karadelik">🕳️ Kara Delik</button>
                    <button class="muzik-sec text-left px-3 py-1.5 rounded-xl text-xs text-gray-300 hover:bg-gray-800 transition cursor-pointer" data-muzik="lav">🌋 Lav Sesi</button>
                    <button id="muzikKapatBtn" class="text-left px-3 py-1.5 rounded-xl text-xs text-red-400 hover:bg-gray-800 transition border-t border-gray-800 mt-1 cursor-pointer">🔇 Kapat</button>
                </div>
                <button id="muzikMenuToggleBtn" class="w-full bg-gray-800 hover:bg-gray-700 text-cyan-400 font-semibold py-2 px-1 rounded-xl transition flex items-center justify-center gap-1 text-xs border border-gray-700/50 cursor-pointer">
                    <span id="muzikBtnMetin">🎵 Müzik</span>
                </button>
            </div>
        </div>
    </aside>

    <audio id="arkaPlanMuzik" loop class="hidden"></audio>

    <!-- SAĞ ANA ALAN -->
    <main class="flex-1 flex flex-col h-[100dvh] relative overflow-hidden w-full">
        <header class="h-14 border-b border-gray-800/60 flex items-center justify-between px-4 bg-darkBg/90 backdrop-blur z-20 shrink-0">
            <div class="flex items-center gap-2 overflow-hidden">
                <button id="menuToggleBtn" class="text-cyan-400 hover:text-cyan-300 p-1.5 rounded-lg border border-gray-800 text-sm transition hover:bg-gray-800/50 cursor-pointer shrink-0">
                    ☰
                </button>
                <div id="aktifBaslik" class="font-bold text-xs md:text-sm text-gray-200 truncate">Yeni Sohbet</div>
                <button id="baslikDuzenleBtn" title="Düzenle" class="text-gray-400 hover:text-cyan-400 text-xs shrink-0 cursor-pointer">✏️</button>
            </div>
            
            <button id="temaToggleBtn" class="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 text-yellow-400 flex items-center justify-center transition text-sm shrink-0 cursor-pointer">
                ☀️
            </button>
        </header>

        <div id="sohbetKutusu" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl w-full mx-auto"></div>

        <div class="p-3 md:p-4 max-w-4xl w-full mx-auto z-20 shrink-0">
            <div class="bg-pillBg border border-gray-800 rounded-2xl md:rounded-3xl p-1.5 md:p-2 flex items-center gap-2 shadow-xl relative">
                <div class="relative shrink-0">
                    <button id="dosyaMenuToggleBtn" class="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 text-cyan-400 flex items-center justify-center font-bold transition text-base cursor-pointer">
                        +
                    </button>
                    <div id="dosyaMenu" class="hidden absolute bottom-12 left-0 bg-sidebarBg border border-gray-700 rounded-2xl shadow-2xl p-2 w-44 z-30 flex flex-col gap-1">
                        <label class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs text-gray-300 hover:bg-gray-800 cursor-pointer transition">
                            <span>📷 Görsel Ekle</span>
                            <input type="file" id="gorselInput" class="hidden" accept="image/*">
                        </label>
                        <label class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs text-gray-300 hover:bg-gray-800 cursor-pointer transition">
                            <span>📁 Belge Ekle</span>
                            <input type="file" id="dosyaInput" class="hidden">
                        </label>
                    </div>
                </div>

                <input type="text" id="mesajGiris" placeholder="Mesajınızı yazın veya mikrofonu kullanın..." 
                    class="flex-1 bg-transparent border-none outline-none px-1 text-xs md:text-sm placeholder-gray-500 text-gray-100 min-w-0">
                
                <!-- SESLİ KOMUT (MİKROFON) BUTONU -->
                <button id="mikrofonBtn" title="Sesli Yaz" class="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-300 flex items-center justify-center transition text-sm cursor-pointer shrink-0">
                    🎤
                </button>

                <button id="mesajGonderBtn" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-cyan-400 text-darkBg flex items-center justify-center font-bold hover:bg-cyan-300 transition shadow-md shrink-0 cursor-pointer text-sm">
                    ➤
                </button>
            </div>
            <div id="secilenDosyaBilgi" class="text-[11px] text-cyan-400 mt-1 px-3 hidden flex justify-between items-center">
                <span id="secilenDosyaAdi" class="truncate">Dosya seçildi</span>
                <button id="dosyaIptalBtn" class="text-red-400 hover:underline shrink-0 cursor-pointer ml-2">İptal</button>
            </div>
        </div>
    </main>

    <script>
        let sohbetler = JSON.parse(localStorage.getItem('nova_web_sohbetler')) || [];
        let aktifSohbetId = null;
        let yuklenenDosyaVerisi = null;
        let mevcutTema = localStorage.getItem('nova_tema') || 'dark';
        let aktifAtmosfer = localStorage.getItem('nova_atmosfer') || 'derinUzay';

        let audioCtx = null;
        let activeSynthNodes = [];

        if (mevcutTema === 'light') {
            document.documentElement.classList.remove('dark');
            document.getElementById('temaToggleBtn').innerText = '🌙';
        }

        atmosferUygula(aktifAtmosfer);

        const sidebar = document.getElementById('sidebar');
        const mobilPerde = document.getElementById('mobilPerde');
        const sohbetKutusu = document.getElementById('sohbetKutusu');
        const mesajGiris = document.getElementById('mesajGiris');
        const aktifBaslik = document.getElementById('aktifBaslik');
        const gecmisListesi = document.getElementById('gecmisListesi');
        const secilenDosyaBilgi = document.getElementById('secilenDosyaBilgi');
        const secilenDosyaAdi = document.getElementById('secilenDosyaAdi');
        const dosyaMenu = document.getElementById('dosyaMenu');
        const atmosferMenu = document.getElementById('atmosferMenu');
        const muzikMenu = document.getElementById('muzikMenu');
        const arkaPlanMuzik = document.getElementById('arkaPlanMuzik');
        const muzikBtnMetin = document.getElementById('muzikBtnMetin');
        const muzikMenuToggleBtn = document.getElementById('muzikMenuToggleBtn');

        document.getElementById('temaToggleBtn').addEventListener('click', temaToggle);
        document.getElementById('menuToggleBtn').addEventListener('click', menuAcKapat);
        document.getElementById('mobilMenuKapat').addEventListener('click', menuAcKapat);
        mobilPerde.addEventListener('click', menuAcKapat);

        document.getElementById('dosyaMenuToggleBtn').addEventListener('click', () => dosyaMenu.classList.toggle('hidden'));
        document.getElementById('atmosferMenuToggleBtn').addEventListener('click', () => { atmosferMenu.classList.toggle('hidden'); muzikMenu.classList.add('hidden'); });
        document.getElementById('muzikMenuToggleBtn').addEventListener('click', () => { muzikMenu.classList.toggle('hidden'); atmosferMenu.classList.add('hidden'); });
        document.getElementById('muzikKapatBtn').addEventListener('click', muzikDurdur);
        document.getElementById('yeniSohbetBtn').addEventListener('click', yeniSohbetBaslat);
        document.getElementById('baslikDuzenleBtn').addEventListener('click', aktifSohbetBasliginiDuzenle);
        document.getElementById('disaAktarBtn').addEventListener('click', sohbetleriDisaAktar);
        document.getElementById('sohbetIndirBtn').addEventListener('click', aktifSohbetiTxtIndir);
        document.getElementById('jsonYukle').addEventListener('change', sohbetleriIceAktar);
        document.getElementById('mesajGonderBtn').addEventListener('click', mesajGonder);
        document.getElementById('dosyaIptalBtn').addEventListener('click', () => { yuklenenDosyaVerisi = null; secilenDosyaBilgi.classList.add('hidden'); });
        document.getElementById('sohbetArama').addEventListener('input', (e) => sohbetListesiniGuncelle(e.target.value));

        // Sesli Asistan (Mikrofon)
        const mikrofonBtn = document.getElementById('mikrofonBtn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = false;
            recognition.interimResults = false;

            mikrofonBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    mikrofonBtn.classList.add('bg-cyan-500', 'text-darkBg');
                } catch(e) {}
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                mesajGiris.value += (mesajGiris.value ? ' ' : '') + transcript;
                mikrofonBtn.classList.remove('bg-cyan-500', 'text-darkBg');
            };

            recognition.onerror = () => { mikrofonBtn.classList.remove('bg-cyan-500', 'text-darkBg'); };
            recognition.onend = () => { mikrofonBtn.classList.remove('bg-cyan-500', 'text-darkBg'); };
        } else {
            mikrofonBtn.style.display = 'none';
        }

        document.getElementById('gorselInput').addEventListener('change', (e) => dosyaSecildi(e, 'image'));
        document.getElementById('dosyaInput').addEventListener('change', (e) => dosyaSecildi(e, 'file'));

        document.querySelectorAll('.atmosfer-sec').forEach(btn => {
            btn.addEventListener('click', () => atmosferDegistir(btn.getAttribute('data-mod')));
        });

        document.querySelectorAll('.muzik-sec').forEach(btn => {
            btn.addEventListener('click', () => muzikCal(btn.getAttribute('data-muzik')));
        });

        mesajGiris.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); mesajGonder(); }
        });

        function menuAcKapat() {
            sidebar.classList.toggle('sidebar-kapali');
            if (window.innerWidth < 768) {
                mobilPerde.classList.toggle('hidden');
            }
        }

        function temaToggle() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('nova_tema', 'light');
                document.getElementById('temaToggleBtn').innerText = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('nova_tema', 'dark');
                document.getElementById('temaToggleBtn').innerText = '☀️';
            }
        }

        function sesSisteminiSifirla() {
            arkaPlanMuzik.pause();
            arkaPlanMuzik.currentTime = 0;
            if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
            activeSynthNodes.forEach(node => { try { node.stop(); } catch(e){} });
            activeSynthNodes = [];
        }

        function muzikCal(tur) {
            muzikMenu.classList.add('hidden');
            sesSisteminiSifirla();

            if (tur === 'karadelik') {
                baslatKaraDelikSesi();
                muzikMenuToggleBtn.classList.add('bg-cyan-500/20', 'border-cyan-500');
                muzikBtnMetin.innerText = 'Çalıyor';
            } else if (tur === 'lav') {
                baslatLavSesi();
                muzikMenuToggleBtn.classList.add('bg-cyan-500/20', 'border-cyan-500');
                muzikBtnMetin.innerText = 'Çalıyor';
            } else {
                let kaynaklar = {
                    lofi: "https://stream.zeno.fm/f3wvbbqmdg8uv",
                    yagmur: "https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"
                };
                arkaPlanMuzik.src = kaynaklar[tur] || kaynaklar.lofi;
                arkaPlanMuzik.play().then(() => {
                    muzikMenuToggleBtn.classList.add('bg-cyan-500/20', 'border-cyan-500');
                    muzikBtnMetin.innerText = 'Çalıyor';
                }).catch(() => alert("Tarayıcı ses engeli oluştu."));
            }
        }

        function baslatKaraDelikSesi() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc1.type = 'sine'; osc1.frequency.setValueAtTime(45, audioCtx.currentTime);
            osc2.type = 'triangle'; osc2.frequency.setValueAtTime(50, audioCtx.currentTime);
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(120, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            osc1.connect(filter); osc2.connect(filter);
            filter.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc1.start(); osc2.start();
            activeSynthNodes.push(osc1, osc2);
        }

        function baslatLavSesi() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer; noise.loop = true;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass'; filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            const gainNode = audioCtx.createGain(); gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

            noise.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
            noise.start(); activeSynthNodes.push(noise);

            function patlamaUret() {
                if (!audioCtx || audioCtx.state === 'closed') return;
                const osc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(100 + Math.random() * 300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                bGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                bGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(bGain); bGain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                setTimeout(patlamaUret, 200 + Math.random() * 600);
            }
            patlamaUret();
        }

        function muzikDurdur() {
            muzikMenu.classList.add('hidden');
            sesSisteminiSifirla();
            muzikMenuToggleBtn.classList.remove('bg-cyan-500/20', 'border-cyan-500');
            muzikBtnMetin.innerText = 'Müzik';
        }

        function atmosferDegistir(mod) {
            aktifAtmosfer = mod;
            localStorage.setItem('nova_atmosfer', mod);
            atmosferUygula(mod);
            atmosferMenu.classList.add('hidden');
        }

        function atmosferUygula(mod) {
            const renkler = {
                derinUzay: { bg: '#050508', sidebar: '#0b0c10', pill: '#12131c' },
                siberpunk: { bg: '#0f051d', sidebar: '#1a0933', pill: '#260d4d' },
                matris: { bg: '#021005', sidebar: '#051f0b', pill: '#0a3812' },
                sakinOrman: { bg: '#080d0d', sidebar: '#0e1717', pill: '#162424' },
                buzul: { bg: '#040d14', sidebar: '#081724', pill: '#0e2940' }
            };
            const secilen = renkler[mod] || renkler.derinUzay;
            document.body.style.backgroundColor = secilen.bg;
            document.getElementById('sidebar').style.backgroundColor = secilen.sidebar;
            
            let styleTag = document.getElementById('dynamicAtmosfer') || document.createElement('style');
            styleTag.id = 'dynamicAtmosfer';
            styleTag.innerHTML = `.bg-darkBg { background-color: ${secilen.bg} !important; } .bg-sidebarBg { background-color: ${secilen.sidebar} !important; } .bg-pillBg { background-color: ${secilen.pill} !important; }`;
            document.head.appendChild(styleTag);
        }

        function verileriKaydet() { localStorage.setItem('nova_web_sohbetler', JSON.stringify(sohbetler)); }

        function yeniSohbetBaslat() {
            const yeniId = Date.now();
            sohbetler.unshift({ id: yeniId, baslik: "Yeni Sohbet", mesajlar: [] });
            aktifSohbetiYukle(yeniId);
            if(window.innerWidth < 768) menuAcKapat();
        }

        function aktifSohbetiYukle(id) {
            aktifSohbetId = id;
            const sohbet = sohbetler.find(s => s.id === id);
            if (!sohbet) return;
            aktifBaslik.innerText = sohbet.baslik;
            sohbetKutusu.innerHTML = "";
            sohbet.mesajlar.forEach((m, index) => mesajEkranaEkle(m.rol, m.metin, index, false, m.tip, m.dosyaAdi));
            sohbetListesiniGuncelle();
            if(window.innerWidth < 768 && !sidebar.classList.contains('sidebar-kapali')) menuAcKapat();
        }

        function sohbetListesiniGuncelle(filtre = "") {
            gecmisListesi.innerHTML = "";
            sohbetler.filter(s => {
                const baslikEslesme = s.baslik.toLowerCase().includes(filtre.toLowerCase());
                const mesajEslesme = s.mesajlar.some(m => m.metin.toLowerCase().includes(filtre.toLowerCase()));
                return baslikEslesme || mesajEslesme;
            }).forEach(s => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between px-3 py-2 rounded-xl text-xs md:text-sm cursor-pointer transition ${s.id === aktifSohbetId ? 'bg-cyan-500/10 text-cyan-400 font-medium' : 'text-gray-400 hover:bg-gray-800/50'}`;
                
                const span = document.createElement('span');
                span.className = 'truncate flex-1'; span.innerText = s.baslik;
                span.addEventListener('click', () => aktifSohbetiYukle(s.id));
                
                const silBtn = document.createElement('button');
                silBtn.className = 'text-red-400 hover:text-red-300 px-1 text-xs'; silBtn.innerText = '✕';
                silBtn.addEventListener('click', (ev) => { ev.stopPropagation(); sohbetler = sohbetler.filter(x => x.id !== s.id); verileriKaydet(); if(sohbetler.length === 0) yeniSohbetBaslat(); else aktifSohbetiYukle(sohbetler[0].id); });

                div.appendChild(span); div.appendChild(silBtn);
                gecmisListesi.appendChild(div);
            });
        }

        function aktifSohbetBasliginiDuzenle() {
            let sohbet = sohbetler.find(s => s.id === aktifSohbetId);
            if (!sohbet) return;
            const yeniAd = prompt("Yeni başlık:", sohbet.baslik);
            if (yeniAd && yeniAd.trim() !== "") { sohbet.baslik = yeniAd.trim(); aktifBaslik.innerText = sohbet.baslik; verileriKaydet(); sohbetListesiniGuncelle(); }
        }

        function sohbetleriDisaAktar() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sohbetler));
            const a = document.createElement('a'); a.href = dataStr; a.download = `nova_yedek.json`; a.click(); a.remove();
        }

        function aktifSohbetiTxtIndir() {
            const sohbet = sohbetler.find(s => s.id === aktifSohbetId);
            if (!sohbet || sohbet.mesajlar.length === 0) { alert("İndirilecek mesaj yok!"); return; }
            let icerik = `Sohbet Başlığı: ${sohbet.baslik}\nTarih:${new Date().toLocaleString()}\n-----------------------------------\n\n`;
            sohbet.mesajlar.forEach(m => {
                icerik += `${m.rol === 'user' ? 'Kullanıcı' : 'NOVA'}: ${m.metin}\n\n`;
            });
            const blob = new Blob([icerik], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${sohbet.baslik.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.txt`;
            a.click();
            a.remove();
        }

        function sohbetleriIceAktar(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    sohbetler = JSON.parse(evt.target.result);
                    verileriKaydet();
                    if(sohbetler.length > 0) aktifSohbetiYukle(sohbetler[0].id);
                } catch(err) { alert("Geçersiz dosya!"); }
            };
            reader.readAsText(file);
        }

        function dosyaSecildi(e, tur) {
            const file = e.target.files[0];
            if (!file) return;
            dosyaMenu.classList.add('hidden');
            const reader = new FileReader();
            reader.onload = function(evt) {
                yuklenenDosyaVerisi = { isim: file.name, tip: tur === 'image' || file.type.startsWith('image/') ? 'image' : 'file', veri: evt.target.result };
                secilenDosyaAdi.innerText = file.name;
                secilenDosyaBilgi.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function mesajEkranaEkle(rol, metin, index, scroll = true, tip = 'text', dosyaAdi = null) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${rol === 'user' ? 'items-end' : 'items-start'} mb-3 group relative`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[90%] md:max-w-[80%] rounded-2xl px-3.5 py-2.5 text-xs md:text-sm leading-relaxed markdown-body ${rol === 'user' ? 'bg-cyan-500 text-darkBg font-medium rounded-br-none' : 'bg-pillBg border border-gray-800 text-gray-200 rounded-bl-none shadow-sm'}`;
            
            if (tip === 'typing') {
                bubble.innerHTML = `<div class="flex items-center gap-2"><span class="text-xs text-cyan-400">Yazıyor</span><div class="typing-dot"><span></span><span></span><span></span></div></div>`;
            } else if (tip === 'image-upload' || tip === 'image') {
                bubble.innerHTML = `<p class="mb-1 text-[11px] text-cyan-300 font-semibold">${dosyaAdi || 'Görsel'}</p><img src="${metin}" class="rounded-xl w-full max-h-60 object-cover border border-gray-700">`;
            } else if (rol === 'assistant') {
                bubble.innerHTML = marked.parse(metin);
                
                bubble.querySelectorAll('pre').forEach(pre => {
                    const code = pre.querySelector('code');
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.innerText = 'Kopyala';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
                        copyBtn.innerText = 'Kopyalandı!';
                        setTimeout(() => copyBtn.innerText = 'Kopyala', 2000);
                    };
                    pre.appendChild(copyBtn);
                });

                const sesBtn = document.createElement('button');
                sesBtn.className = 'mt-2 text-[11px] text-cyan-400 hover:underline flex items-center gap-1 cursor-pointer';
                sesBtn.innerHTML = '🔊 Sesli Dinle';
                sesBtn.onclick = () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(metin.replace(/[*#_`]/g, ''));
                        utterance.lang = 'tr-TR';
                        window.speechSynthesis.speak(utterance);
                    } else {
                        alert("Tarayıcınız sesli okumayı desteklemiyor.");
                    }
                };
                bubble.appendChild(sesBtn);

            } else {
                bubble.innerText = metin;
            }

            // HOVER İLE ÇIKAN DÜZENLE VE SİL BUTONLARI
            if (tip !== 'typing') {
                const actionMenu = document.createElement('div');
                actionMenu.className = `absolute -top-3 ${rol === 'user' ? 'right-2' : 'left-2'} hidden group-hover:flex items-center gap-1 bg-sidebarBg border border-gray-700 rounded-lg px-2 py-0.5 shadow-md z-10 text-[10px]`;
                
                const editBtn = document.createElement('button');
                editBtn.className = 'text-cyan-400 hover:underline cursor-pointer';
                editBtn.innerText = '✏️ Düzenle';
                editBtn.onclick = () => {
                    let sohbet = sohbetler.find(s => s.id === aktifSohbetId);
                    if (!sohbet) return;
                    let yeniIcerik = prompt("Mesajı düzenle:", sohbet.mesajlar[index].metin);
                    if (yeniIcerik !== null && yeniIcerik.trim() !== "") {
                        sohbet.mesajlar[index].metin = yeniIcerik.trim();
                        verileriKaydet();
                        aktifSohbetiYukle(aktifSohbetId);
                    }
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-red-400 hover:underline cursor-pointer ml-1';
                deleteBtn.innerText = '🗑️ Sil';
                deleteBtn.onclick = () => {
                    let sohbet = sohbetler.find(s => s.id === aktifSohbetId);
                    if (!sohbet) return;
                    sohbet.mesajlar.splice(index, 1);
                    verileriKaydet();
                    aktifSohbetiYukle(aktifSohbetId);
                };

                actionMenu.appendChild(editBtn);
                actionMenu.appendChild(deleteBtn);
                wrapper.appendChild(actionMenu);
            }

            wrapper.appendChild(bubble);
            sohbetKutusu.appendChild(wrapper);
            if (scroll) sohbetKutusu.scrollTop = sohbetKutusu.scrollHeight;
        }

        // GELİŞTİRİLMİŞ SAĞLAM AI BAĞLANTI FONKSİYONU
        async function gercekAiYanitAl(metin) {
            const sistemTalimati = "Sen NOVA adlı profesyonel yapay zeka asistanısın. Türkçe yanıt ver. Asla boş süslü parantez {} veya anlamsız kısa karakterler döndürme. Güncel bilgileri, kod yazmayı ve açıklamaları eksiksiz yap.";
            
            for (let deneme = 0; deneme < 3; deneme++) {
                try {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(sistemTalimati + " Kullanıcı Mesajı: " + metin)}?model=openai`);
                    if (!res.ok) continue;
                    let yanit = await res.text();
                    
                    if (yanit && yanit.trim() !== "" && yanit.trim() !== "{}") {
                        return yanit.trim();
                    }
                } catch (err) {
                    console.error("Bağlantı denemesi başarısız:", err);
                }
            }
            return "⚠️ Sunucudan geçici olarak yanıt alınamadı veya sunucu yoğun. Lütfen tekrar deneyin.";
        }

        async function akilliBaslikOlustur(ilkMesaj) {
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Şu cümle için maksimum 3-4 kelimeden oluşan kısa, özet bir sohbet başlığı yaz, tırnak kullanma: " + ilkMesaj)}?model=openai`);
                let baslik = await res.text();
                if (!baslik || baslik.trim() === "{}" || baslik.includes("error")) throw new Error();
                return baslik.trim().replace(/['"]/g, '').substring(0, 25);
            } catch {
                return ilkMesaj.substring(0, 20);
            }
        }

        async function mesajGonder() {
            const metin = mesajGiris.value.trim();
            if (!metin && !yuklenenDosyaVerisi) return;

            let sohbet = sohbetler.find(s => s.id === aktifSohbetId) || (() => { yeniSohbetBaslat(); return sohbetler[0]; })();
            
            let aktifDosya = yuklenenDosyaVerisi;
            yuklenenDosyaVerisi = null;
            secilenDosyaBilgi.classList.add('hidden');
            mesajGiris.value = "";

            let ilkMesajMi = sohbet.mesajlar.length === 0;

            if (aktifDosya) {
                sohbet.mesajlar.push({ rol: 'user', metin: aktifDosya.veri, tip: 'image-upload', dosyaAdi: aktifDosya.isim });
                mesajEkranaEkle('user', aktifDosya.veri, sohbet.mesajlar.length - 1, true, 'image-upload', aktifDosya.isim);
                verileriKaydet();
                setTimeout(() => {
                    sohbet.mesajlar.push({ rol: 'assistant', metin: `Dosya incelendi: **${aktifDosya.isim}**`, tip: 'text' });
                    verileriKaydet(); aktifSohbetiYukle(aktifSohbetId);
                }, 800);
                return;
            }

            sohbet.mesajlar.push({ rol: 'user', metin, tip: 'text' });
            mesajEkranaEkle('user', metin, sohbet.mesajlar.length - 1, true, 'text');
            verileriKaydet();

            if (ilkMesajMi) {
                akilliBaslikOlustur(metin).then(yeniBaslik => {
                    sohbet.baslik = yeniBaslik;
                    aktifBaslik.innerText = yeniBaslik;
                    verileriKaydet();
                    sohbetListesiniGuncelle();
                });
            }

            sohbet.mesajlar.push({ rol: 'assistant', metin: '', tip: 'typing' });
            mesajEkranaEkle('assistant', '', sohbet.mesajlar.length - 1, true, 'typing');

            const aiYaniti = await gercekAiYanitAl(metin);
            sohbet.mesajlar.pop();
            sohbet.mesajlar.push({ rol: 'assistant', metin: aiYaniti, tip: 'text' });
            verileriKaydet();
            aktifSohbetiYukle(aktifSohbetId);
        }

        if (sohbetler.length === 0) yeniSohbetBaslat();
        else aktifSohbetiYukle(sohbetler[0].id);
    </script>
