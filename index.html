<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - AI Web Application</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-container img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }
        .logo-container h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            overflow-y: auto;
            gap: 20px;
        }
        .message {
            padding: 15px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
        }
        .ai-message {
            background-color: #1f2937;
            align-self: flex-start;
            border-left: 4px solid #3b82f6;
        }
        /* Sitenin içine eklenecek görsel alanı için stil */
        .content-image {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid #374151;
            margin-top: 10px;
        }
        .input-area {
            padding: 20px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: center;
        }
        .input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #1f2937;
            color: white;
            outline: none;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="NOVA Logo">
            <h1>NOVA AI</h1>
        </div>
        <span style="font-size: 14px; color: #9ca3af;">Canlı Sürüm v1.0</span>
    </header>

    <div class="chat-container">
        <div class="message ai-message">
            Merhaba! Ben <strong>NOVA</strong>. Yapay zeka asistanınız hizmete hazır. 
            <br><br>
            Aşağıya senin için bir örnek görsel de ekledim (Kendi görselini eklemek istersen dosya adını değiştirebilirsin):
            <br>
            <!-- Buradaki src kısmına kendi yüklediğin görselin adını yazabilirsin (Örn: resim.jpg) -->
            <img src="logo.jpg" alt="Örnek Görsel" class="content-image">
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" placeholder="NOVA'ya bir şeyler yazın..." disabled>
            <button disabled>Gönder</button>
        </div>
    </div>

</body>
</html>
