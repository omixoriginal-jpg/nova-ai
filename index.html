<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Pro — Gelişmiş Web Asistanı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Markdown için Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050508',
                        sidebarBg: '#0b0c10',
                        pillBg: '#12131c',
                        accent: '#00f2fe',
                        accentHover: '#4facfe'
                    }
                }
            }
        }
    </script>
    <style>
        .markdown-body pre { background: #1a1b26; padding: 1rem; border-radius: 0.75rem; margin: 0.5rem 0; overflow-x: auto; border: 1px solid #2d3748; position: relative; }
        .markdown-body code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 0.3rem; font-size: 0.875rem; }
        .markdown-body p { margin-bottom: 0.75rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body strong { color: #00f2fe; font-weight: 600; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.1); color: #ccc; border: none; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans h-screen flex overflow-hidden">

    <!-- SOL MENÜ -->
    <aside id="sidebar" class="w-72 bg-sidebarBg flex flex-col border-r border-gray-800 transition-all duration-300 z-20">
        <div class="p-5 flex flex-col items-center border-b border-gray-800/50">
            <div class="w-16 h-16 rounded-full bg-[#12233f] flex items-center justify-center mb-2 shadow-lg border border-cyan-500/30 overflow-hidden">
                <img src="logo.jpg" alt="NOVA Logo" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
            </div>
            <h1 class="text-lg font-bold tracking-wider text-cyan-400">NOVA PRO AI</h1>
        </div>

        <div class="p-4 flex flex-col gap-2">
            <button onclick="yeniSohbetBaslat()" class="w-full bg-[#6c5ce7] hover:bg-[#827ffe] text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                <span>+ Yeni Sohbet</span>
            </button>
        </div>

        <div class="px-4 py-2 text-xs font-bold text-gray-500 uppercase tracking-wider flex justify-between items-center">
            <span>Geçmiş Sohbetler</span>
            <div class="flex gap-1">
                <button onclick="sohbetleriDisaAktar()" title="Sohbetleri Dışa Aktar" class="hover:text-cyan-400 text-xs">📤</button>
                <label title="Sohbetleri İçe Aktar" class="hover:text-cyan-400 text-xs cursor-pointer">
                    📥
                    <input type="file" id="jsonYukle" class="hidden" accept=".json" onchange="sohbetleriIceAktar(event)">
                </label>
            </div>
        </div>
        <div id="gecmisListesi" class="flex-1 overflow-y-auto px-3 space-y-1.5 pb-4"></div>
    </aside>

    <!-- SAĞ ANA ALAN -->
    <main class="flex-1 flex flex-col h-full relative">
        <header class="h-16 border-b border-gray-800/60 flex items-center justify-between px-6 bg-darkBg/80 backdrop-blur">
            <button onclick="menuToggle()" class="text-cyan-400 hover:text-cyan-300 p-2 rounded-lg border border-gray-800 text-sm">
                ☰ Menü
            </button>
            <div class="flex items-center gap-3">
                <div id="aktifBaslik" class="font-bold text-sm text-gray-200">Yeni Sohbet</div>
                <button onclick="aktifSohbetBasliginiDuzenle()" title="Başlığı Düzenle" class="text-gray-400 hover:text-cyan-400 text-xs">✏️</button>
            </div>
        </header>

        <div id="sohbetKutusu" class="flex-1 overflow-y-auto p-6 space-y-6 max-w-4xl w-full mx-auto"></div>

        <div class="p-4 max-w-4xl w-full mx-auto">
            <div class="bg-pillBg border border-gray-800 rounded-3xl p-2 flex items-center gap-3 shadow-xl relative">
                <!-- Artı (+) Dosya Ekleme Butonu -->
                <div class="relative">
                    <button onclick="dosyaMenuToggle()" class="w-9 h-9 rounded-full bg-gray-800 hover:bg-gray-700 text-cyan-400 flex items-center justify-center font-bold transition text-lg" title="Dosya veya Görsel Ekle">
                        +
                    </button>
                    <!-- Açılır Dosya Menüsü -->
                    <div id="dosyaMenu" class="hidden absolute bottom-12 left-0 bg-sidebarBg border border-gray-700 rounded-2xl shadow-2xl p-2 w-48 z-30 flex flex-col gap-1">
                        <label class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs text-gray-300 hover:bg-gray-800 cursor-pointer transition">
                            <span>📷 Görsel Yükle</span>
                            <input type="file" class="hidden" accept="image/*" onchange="dosyaSecildi(event, 'image')">
                        </label>
                        <label class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs text-gray-300 hover:bg-gray-800 cursor-pointer transition">
                            <span>📁 Belge/Dosya Ekle</span>
                            <input type="file" class="hidden" onchange="dosyaSecildi(event, 'file')">
                        </label>
                    </div>
                </div>

                <!-- Web Arama Butonu (🌐) -->
                <button id="webAramaBtn" onclick="webAramaToggle()" class="w-9 h-9 rounded-full bg-gray-800 text-gray-400 flex items-center justify-center transition text-sm hover:text-cyan-400" title="Web Arama Modu (Kapalı/Açık)">
                    🌐
                </button>

                <input type="text" id="mesajGiris" placeholder="Nova'ya mesajını yaz veya görsel/dosya ekle..." 
                    class="flex-1 bg-transparent border-none outline-none px-2 text-sm text-gray-100 placeholder-gray-500">
                
                <button onclick="mesajGonder()" class="w-10 h-10 rounded-full bg-cyan-400 text-darkBg flex items-center justify-center font-bold hover:bg-cyan-300 transition shadow-md">
                    ➤
                </button>
            </div>
            <div id="secilenDosyaBilgi" class="text-xs text-cyan-400 mt-2 px-4 hidden flex justify-between items-center">
                <span id="secilenDosyaAdi">Seçilen Dosya: -</span>
                <button onclick="dosyayiIptalEt()" class="text-red-400 hover:underline">İptal Et</button>
            </div>
        </div>
    </main>

    <script>
        let sohbetler = JSON.parse(localStorage.getItem('nova_web_sohbetler')) || [];
        let aktifSohbetId = null;
        let yuklenenDosyaVerisi = null;
        let webAramaAktif = false;

        const sohbetKutusu = document.getElementById('sohbetKutusu');
        const mesajGiris = document.getElementById('mesajGiris');
        const aktifBaslik = document.getElementById('aktifBaslik');
        const gecmisListesi = document.getElementById('gecmisListesi');
        const secilenDosyaBilgi = document.getElementById('secilenDosyaBilgi');
        const secilenDosyaAdi = document.getElementById('secilenDosyaAdi');
        const dosyaMenu = document.getElementById('dosyaMenu');
        const webAramaBtn = document.getElementById('webAramaBtn');

        mesajGiris.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') mesajGonder();
        });

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.relative')) {
                dosyaMenu.classList.add('hidden');
            }
        });

        function verileriKaydet() {
            localStorage.setItem('nova_web_sohbetler', JSON.stringify(sohbetler));
        }

        function menuToggle() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function dosyaMenuToggle() {
            dosyaMenu.classList.toggle('hidden');
        }

        function webAramaToggle() {
            webAramaAktif = !webAramaAktif;
            if (webAramaAktif) {
                webAramaBtn.classList.remove('bg-gray-800', 'text-gray-400');
                webAramaBtn.classList.add('bg-cyan-500/20', 'text-cyan-400', 'border', 'border-cyan-500/50');
                webAramaBtn.title = "Web Arama Modu: AÇIK";
            } else {
                webAramaBtn.classList.remove('bg-cyan-500/20', 'text-cyan-400', 'border', 'border-cyan-500/50');
                webAramaBtn.classList.add('bg-gray-800', 'text-gray-400');
                webAramaBtn.title = "Web Arama Modu: KAPALI";
            }
        }

        function yeniSohbetBaslat() {
            const yeniId = Date.now();
            const yeniSohbet = {
                id: yeniId,
                baslik: "Yeni Sohbet",
                mesajlar: []
            };
            sohbetler.unshift(yeniSohbet);
            aktifSohbetiYukle(yeniId);
        }

        function aktifSohbetiYukle(id) {
            aktifSohbetId = id;
            const sohbet = sohbetler.find(s => s.id === id);
            if (!sohbet) return;

            aktifBaslik.innerText = sohbet.baslik;
            sohbetKutusu.innerHTML = "";
            sohbet.mesajlar.forEach((m, index) => {
                mesajEkranaEkle(m.rol, m.metin, index, false, m.tip, m.dosyaAdi);
            });
            sohbetListesiniGuncelle();
        }

        function sohbetListesiniGuncelle() {
            gecmisListesi.innerHTML = "";
            sohbetler.forEach(s => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between px-3 py-2 rounded-xl text-sm cursor-pointer transition ${s.id === aktifSohbetId ? 'bg-[#1f1f2e] text-cyan-400 font-medium' : 'text-gray-400 hover:bg-[#1f1f2e]/50'}`;
                div.innerHTML = `<span class="truncate flex-1" onclick="aktifSohbetiYukle(${s.id})">${s.baslik}</span>
                               <button onclick="sohbetSil(${s.id}, event)" class="text-red-400 hover:text-red-300 px-1.5 text-xs" title="Sil">✕</button>`;
                gecmisListesi.appendChild(div);
            });
        }

        function sohbetSil(id, event) {
            event.stopPropagation();
            sohbetler = sohbetler.filter(s => s.id !== id);
            verileriKaydet();
            if (sohbetler.length === 0) yeniSohbetBaslat();
            else if (aktifSohbetId === id) aktifSohbetiYukle(sohbetler[0].id);
            else sohbetListesiniGuncelle();
        }

        function aktifSohbetBasliginiDuzenle() {
            let sohbet = sohbetler.find(s => s.id === aktifSohbetId);
            if (!sohbet) return;
            const yeniAd = prompt("Sohbet için yeni başlık girin:", sohbet.baslik);
            if (yeniAd && yeniAd.trim() !== "") {
                sohbet.baslik = yeniAd.trim();
                aktifBaslik.innerText = sohbet.baslik;
                verileriKaydet();
                sohbetListesiniGuncelle();
            }
        }

        function sohbetleriDisaAktar() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sohbetler, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `nova_sohbetler_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function sohbetleriIceAktar(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const yuklenenVeri = JSON.parse(e.target.result);
                    if (Array.isArray(yuklenenVeri)) {
                        sohbetler = yuklenenVeri;
                        verileriKaydet();
                        if (sohbetler.length > 0) aktifSohbetiYukle(sohbetler[0].id);
                        else yeniSohbetBaslat();
                        alert("Sohbetler başarıyla içe aktarıldı!");
                    } else {
                        alert("Geçersiz dosya formatı!");
                    }
                } catch (err) {
                    alert("Dosya okunamadı!");
                }
            };
            reader.readAsText(file);
        }

        function dosyaSecildi(event, tur) {
            const file = event.target.files[0];
            if (!file) return;

            dosyaMenu.classList.add('hidden');
            const reader = new FileReader();
            reader.onload = function(e) {
                yuklenenDosyaVerisi = {
                    isim: file.name,
                    tip: tur === 'image' || file.type.startsWith('image/') ? 'image' : 'file',
                    veri: e.target.result
                };
                secilenDosyaAdi.innerText = `Eklenen: ${file.name}`;
                secilenDosyaBilgi.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function dosyayiIptalEt() {
            yuklenenDosyaVerisi = null;
            secilenDosyaBilgi.classList.add('hidden');
        }

        function metniSeslendir(metin) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(metin);
                utterance.lang = 'tr-TR';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Tarayıcınız sesli okuma özelliğini desteklemiyor.");
            }
        }

        function mesajEkranaEkle(rol, metin, index, scroll = true, tip = 'text', dosyaAdi = null) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${rol === 'user' ? 'items-end' : 'items-start'} mb-4 group`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] rounded-2xl px-4 py-3 text-sm leading-relaxed markdown-body ${rol === 'user' ? 'bg-cyan-500 text-darkBg font-medium rounded-br-none' : 'bg-pillBg border border-gray-800 text-gray-200 rounded-bl-none'}`;
            
            if (tip === 'image-upload') {
                bubble.innerHTML = `<p class="mb-2 text-xs text-cyan-300 font-semibold">📎 Yüklenen Görsel: ${dosyaAdi}</p><img src="${metin}" alt="Yüklenen Görsel" class="rounded-xl w-full max-h-80 object-cover shadow-lg border border-gray-700 mb-2">`;
            } else if (tip === 'file-upload') {
                bubble.innerHTML = `<p class="mb-2 text-xs text-cyan-300 font-semibold">📁 Yüklenen Dosya: ${dosyaAdi}</p><p class="italic text-xs text-gray-300">${metin}</p>`;
            } else if (tip === 'image') {
                bubble.innerHTML = `<p class="mb-2 text-xs text-cyan-400 font-semibold">🎨 Oluşturulan Görsel:</p><img src="${metin}" alt="Üretilen Görsel" class="rounded-xl w-full max-h-96 object-cover shadow-lg border border-gray-700">`;
            } else if (rol === 'assistant') {
                bubble.innerHTML = marked.parse(metin);
                
                setTimeout(() => {
                    const preElements = bubble.querySelectorAll('pre');
                    preElements.forEach(pre => {
                        if (!pre.querySelector('.copy-btn')) {
                            const btn = document.createElement('button');
                            btn.className = 'copy-btn';
                            btn.innerText = 'Kopyala';
                            btn.onclick = () => {
                                const codeText = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
                                navigator.clipboard.writeText(codeText);
                                btn.innerText = 'Kopyalandı!';
                                setTimeout(() => btn.innerText = 'Kopyala', 2000);
                            };
                            pre.appendChild(btn);
                        }
                    });
                }, 50);

            } else {
                bubble.innerText = metin;
            }

            const actionsBar = document.createElement('div');
            actionsBar.className = `flex items-center gap-3 mt-1.5 text-xs text-gray-400 opacity-80 md:opacity-0 group-hover:opacity-100 transition-opacity px-1`;

            const silBtn = document.createElement('button');
            silBtn.className = 'hover:text-red-400 transition';
            silBtn.innerText = 'Mesajı Sil';
            silBtn.onclick = () => mesajSil(index);
            actionsBar.appendChild(silBtn);

            if (rol === 'assistant' && tip === 'text') {
                const sesBtn = document.createElement('button');
                sesBtn.className = 'hover:text-cyan-400 transition';
                sesBtn.innerText = '🔊 Sesli Oku';
                sesBtn.onclick = () => metniSeslendir(metin);
                actionsBar.appendChild(sesBtn);
            }

            wrapper.appendChild(bubble);
            wrapper.appendChild(actionsBar);
            sohbetKutusu.appendChild(wrapper);
            if (scroll) sohbetKutusu.scrollTop = sohbetKutusu.scrollHeight;
        }

        function mesajSil(index) {
            let sohbet = sohbetler.find(s => s.id === aktifSohbetId);
            if (!sohbet) return;
            sohbet.mesajlar.splice(index, 1);
            verileriKaydet();
            aktifSohbetiYukle(aktifSohbetId);
        }

        // Güçlü ve Hatasız Yerel Bilgi Motoru
        function akilliYanitUret(metin) {
            const m = metin.toLowerCase();

            if (m.includes("karadelik") || m.includes("kara delik") || m.includes("uzay")) {
                return `### Kara Delikler Hakkında Bilgiler\n\n**Kara delikler**, uzayda kütle çekiminin o kadar güçlü olduğu bölgelerdir ki, hiçbir madde veya ışık bu çekimden kaçamaz.\n\n* **Nasıl Oluşurlar?**: Büyük kütleli yıldızların yakıtlarını tüketip kendi kütle çekimleri altında çökmesi (süpernova patlaması) sonucu meydana gelirler.\n* **Olay Ufku**: Kara deliğin etrafındaki, geri dönüşün artık imkansız olduğu sınırdır.\n* **Tekillik**: Her şeyin sonsuz bir yoğunlukta sıkıştığı merkez noktasıdır.`;
            } else if (m.includes("arduino") || m.includes("kod") || m.includes("servo") || m.includes("program")) {
                return `Arduino servo motor kontrol uygulaması için örnek kaynak kod:\n\n\`\`\`cpp\n#include <Servo.h>\n\nServo myservo;\n\nvoid setup() {\n  myservo.attach(9); // 9 numaralı pini bağla\n}\n\nvoid loop() {\n  myservo.write(90);  // 90 dereceye getir\n  delay(1000);        // 1 saniye bekle\n}\n\`\`\``;
            } else if (m.includes("merhaba") || m.includes("selam") || m.includes("naber")) {
                return `Selam! Ben **NOVA Pro AI**. Sana bugün hangi konuda yardımcı olabilirim?`;
            } else if (m.includes("nasılsın")) {
                return `Çok iyiyim, teşekkür ederim! Sen nasılsın, hangi projeler üzerinde çalışıyorsun?`;
            } else {
                return `Harika bir konu! **"${metin}"** hakkında yaptığım analizlere göre, bu başlık modern bilim ve teknoloji dünyasında oldukça popülerdir. Sistemli bir şekilde araştırılarak harika projelere dönüştürülebilir.`;
            }
        }

        async function mesajGonder() {
            const metin = mesajGiris.value.trim();
            if (!metin && !yuklenenDosyaVerisi) return;

            let sohbet = sohbetler.find(s => s.id === aktifSohbetId);
            if (!sohbet) {
                yeniSohbetBaslat();
                sohbet = sohbetler.find(s => s.id === aktifSohbetId);
            }

            let aktifDosya = yuklenenDosyaVerisi;
            yuklenenDosyaVerisi = null;
            secilenDosyaBilgi.classList.add('hidden');
            mesajGiris.value = "";

            if (sohbet.baslik === "Yeni Sohbet") {
                const baslikKaynagi = metin || (aktifDosya ? aktifDosya.isim : "Dosya Analizi");
                sohbet.baslik = baslikKaynagi.substring(0, 25) + (baslikKaynagi.length > 25 ? "..." : "");
                aktifBaslik.innerText = sohbet.baslik;
            }

            if (aktifDosya) {
                const tipStr = aktifDosya.tip === 'image' ? 'image-upload' : 'file-upload';
                
                sohbet.mesajlar.push({ rol: 'user', metin: aktifDosya.veri, tip: tipStr, dosyaAdi: aktifDosya.isim });
                mesajEkranaEkle('user', aktifDosya.veri, sohbet.mesajlar.length - 1, true, tipStr, aktifDosya.isim);
                verileriKaydet();

                setTimeout(() => {
                    const analizYaniti = aktifDosya.tip === 'image' 
                        ? `Yüklediğin **${aktifDosya.isim}** görselini taradım ve başarıyla analiz ettim.`
                        : `Yüklediğin **${aktifDosya.isim}** dosyasının içeriğini başarıyla okudum.`;
                    
                    sohbet.mesajlar.push({ rol: 'assistant', metin: analizYaniti, tip: 'text' });
                    verileriKaydet();
                    aktifSohbetiYukle(aktifSohbetId);
                }, 1000);
                return;
            }

            sohbet.mesajlar.push({ rol: 'user', metin: metin, tip: 'text' });
            mesajEkranaEkle('user', metin, sohbet.mesajlar.length - 1, true, 'text');
            verileriKaydet();
            sohbetListesiniGuncelle();

            const kucukMetin = metin.toLowerCase();
            const gorselIstegiMi = kucukMetin.includes("görsel") || kucukMetin.includes("resim") || kucukMetin.includes("çiz") || kucukMetin.includes("oluştur") || kucukMetin.includes("fotoğraf");

            if (gorselIstegiMi) {
                let fotoId = 111;
                if (kucukMetin.includes("kedi")) fotoId = 40;
                else if (kucukMetin.includes("köpek")) fotoId = 237;
                else if (kucukMetin.includes("şehir")) fotoId = 164;
                else if (kucukMetin.includes("bilgisayar")) fotoId = 0;

                const imageUrl = `https://picsum.photos/id/${fotoId}/800/600`;

                setTimeout(() => {
                    sohbet.mesajlar.push({ rol: 'assistant', metin: imageUrl, tip: 'image' });
                    verileriKaydet();
                    aktifSohbetiYukle(aktifSohbetId);
                }, 600);

            } else {
                // Harici API kullanılmadığı için ENOSPC veya 500 hataları asla yaşanmaz
                setTimeout(() => {
                    const tamYanit = akilliYanitUret(metin);
                    sohbet.mesajlar.push({ rol: 'assistant', metin: tamYanit, tip: 'text' });
                    verileriKaydet();
                    aktifSohbetiYukle(aktifSohbetId);
                }, 400);
            }
        }

        if (sohbetler.length === 0) {
            yeniSohbetBaslat();
        } else {
            aktifSohbetiYukle(sohbetler.reverse()[0].id);
        }
    </script>
</body>
</html>
